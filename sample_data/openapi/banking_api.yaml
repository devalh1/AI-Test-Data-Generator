
openapi: 3.0.3

info:
  title: Banking API
  version: 1.0.0

paths:
  /accounts:
    post:
      summary: Create a bank account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  minLength: 3
                  maxLength: 60

                age:
                  type: integer
                  minimum: 18
                  maximum: 100

                email:
                  type: string
                  format: email

                account_type:
                  type: string
                  enum:
                    - savings
                    - current

                balance:
                  type: number
                  minimum: 0
                  description: Initial account balance in INR


              required:
                - full_name
                - age
                - email
                - account_type
                - balance


              x-business-rules:
                - name: savings_minimum_balance
                  when:
                    field: account_type
                    equals: savings
                  then:
                    field: balance
                    minimum: 1000

                - name: current_minimum_balance
                  when:
                    field: account_type
                    equals: current
                  then:
                    field: balance
                    minimum: 5000
