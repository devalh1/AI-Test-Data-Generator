
openapi: 3.0.3

info:
  title: Demo API
  version: 1.0.0

paths:
  /products:
    get:
      summary: Get all products

    post:
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: number
                in_stock:
                  type: boolean
              required:
                - name
                - price

  /users:
    get:
      summary: Get all users

    post:
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 20
                full_name:
                  type: string
                  minLength: 3
                  maxLength: 60
                age:
                  type: integer
                  minimum: 18
                  maximum: 100
                email:
                  type: string
                  format: email
                
                tags:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 3

                profile:
                  type: object
                  properties:
                    city:
                      type: string
                    verified:
                      type: boolean

                role:
                  type: string
                  enum:
                    - admin
                    - user
                    - guest

              required:
                - username
                - email
